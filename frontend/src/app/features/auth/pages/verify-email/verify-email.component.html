<div class="flex min-h-screen items-center justify-center bg-slate-100 px-4 py-10 sm:px-6 lg:px-8">
  <div class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-xl shadow-slate-200/80">
    <div class="text-center">
      <h2 class="text-3xl font-bold tracking-tight text-slate-900">Verify your email</h2>
      <p class="mt-2 text-sm text-slate-500">
        We sent a verification code to your email. Enter the 6 digits to continue.
      </p>
    </div>

    <form class="mt-8 space-y-6" [formGroup]="form" (ngSubmit)="onSubmit()">
      @if (errorMessage()) {
        <div class="rounded-xl border border-red-200 bg-red-50 p-3 text-sm text-red-600">
          {{ errorMessage() }}
        </div>
      }

      <div class="space-y-5">
        <div class="space-y-2">
          <label for="email" class="block text-sm font-medium text-slate-700">Email</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            readonly
            class="mt-1 block w-full rounded-xl border border-slate-300 bg-slate-100 px-3 py-2.5 text-sm text-slate-500 shadow-sm outline-none cursor-not-allowed"
          />
        </div>

        <app-verify-code 
        (codeChange)="onCodeChange($event)"
        (resendCode)="onResendEmail()"
        ></app-verify-code>
      </div>

      <button
        type="submit"
        [disabled]="form.invalid || isLoading()"
        class="w-full rounded-xl bg-sky-600 px-4 py-2.5 text-sm font-semibold text-white shadow-lg shadow-sky-600/20 transition hover:bg-sky-700 focus:outline-none focus:ring-4 focus:ring-sky-200 disabled:cursor-not-allowed disabled:opacity-50"
      >
        @if (isLoading()) {
          <span>Verifying...</span>
        } @else {
          <span>Verify account</span>
        }
      </button>
    </form>
  </div>
</div>
