<div class="flex min-h-screen items-center justify-center bg-gray-50 px-4 py-12 sm:px-6 lg:px-8">
  <div class="w-full max-w-md space-y-8 bg-white p-8 shadow-md rounded-lg">
    
    <!-- Encabezado -->
    <div class="text-center">
      <h2 class="text-3xl font-bold tracking-tight text-gray-900">Verifica tu correo electrónico</h2>
      <p class="mt-2 text-sm text-gray-600">
        Hemos enviado un código de verificación de 6 dígitos a tu correo electrónico. Ingrésalo a continuación.
      </p>
    </div>

    <!-- Formulario -->
    <form class="mt-8 space-y-6" [formGroup]="form" (ngSubmit)="onSubmit()">
      
      <!-- Mensaje de error global -->
      @if (errorMessage()) {
        <div class="rounded-md bg-red-50 p-4 text-sm text-red-700 border border-red-200">
          {{ errorMessage() }}
        </div>
      }

      <div class="space-y-4 rounded-md shadow-sm">
        
        <!-- Campo de Correo -->
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Correo electrónico</label>
          <input 
            id="email" 
            type="email" 
            formControlName="email" 
            readonly
            class="mt-1 block w-full rounded-md border border-gray-300 bg-gray-100 px-3 py-2 text-gray-500 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-indigo-500 sm:text-sm cursor-not-allowed"
          />
        </div>

        <!-- Campo de Código -->
        <div>
          <label for="code" class="block text-sm font-medium text-gray-700">Código de verificación</label>
          <input 
            id="code" 
            type="text" 
            maxlength="7"
            formControlName="code" 
            placeholder="123456"
            class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-center text-lg tracking-widest text-gray-900 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-indigo-500 sm:text-sm"
          />
          @if (form.get('code')?.invalid && form.get('code')?.touched) {
            <p class="mt-1 text-xs text-red-600">El código debe tener exactamente 6 dígitos.</p>
          }
        </div>

      </div>

      <!-- Botón de Envío -->
      <div>
        <button 
          type="submit" 
          [disabled]="form.invalid || isLoading()"
          class="group relative flex w-full justify-center rounded-md border border-transparent bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          @if (isLoading()) {
            <span>Verificando...</span>
          } @else {
            <span>Verificar cuenta</span>
          }
        </button>
      </div>

    </form>
  </div>
</div>
