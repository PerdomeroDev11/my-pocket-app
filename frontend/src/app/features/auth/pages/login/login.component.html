<div class="flex min-h-screen items-center justify-center bg-slate-100 px-4 py-10 sm:px-6 lg:px-8">
  <div class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-xl shadow-slate-200/80">
    <div class="mb-6 flex justify-center">
      <div #googleBtn class="w-full flex justify-center items-center"></div>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">
      <div class="text-center">
        <h1 class="text-3xl font-bold tracking-tight text-slate-900">Iniciar sesión</h1>
        <p class="mt-2 text-sm text-slate-500">Accede a tu cuenta para continuar</p>
      </div>

      <div class="space-y-2">
        <label for="email" class="block text-sm font-medium text-slate-700">Correo electrónico</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-2.5 text-slate-900 shadow-sm outline-none transition focus:border-sky-500 focus:bg-white focus:ring-4 focus:ring-sky-100"
        >
      </div>

      <div class="space-y-2">
        <label for="password" class="block text-sm font-medium text-slate-700">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-2.5 text-slate-900 shadow-sm outline-none transition focus:border-sky-500 focus:bg-white focus:ring-4 focus:ring-sky-100"
        >
      </div>

      @if (errorMessage()) {
        <p class="rounded-xl border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-600">{{ errorMessage() }}</p>
      }

      <button
        type="submit"
        [disabled]="form.invalid || isLoading()"
        class="w-full rounded-xl bg-sky-600 px-4 py-2.5 text-sm font-semibold text-white shadow-lg shadow-sky-600/20 transition hover:bg-sky-700 focus:outline-none focus:ring-4 focus:ring-sky-200 disabled:cursor-not-allowed disabled:opacity-50"
      >
        {{ isLoading() ? 'Ingresando...' : 'Iniciar sesión' }}
      </button>

      <p class="text-center text-sm text-slate-600">
        ¿No tienes cuenta?
        <a routerLink="/signup" class="font-semibold text-sky-600 transition hover:text-sky-700">Crear cuenta</a>
      </p>
      <p>
        <a routerLink="/sent-email">forgot password</a>
      </p>
    </form>
  </div>
</div>
