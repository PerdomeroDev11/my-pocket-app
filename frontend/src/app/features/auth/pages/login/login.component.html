<div>
    <div class="w-full mb-6 flex justify-center">
            <div #googleBtn class="w-full flex justify-center items-center"></div>
    </div>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col items-center justify-center gap-4 bg-red-50 p-8 rounded-lg max-w-md mx-auto">
        <h1 class="text-3xl font-bold mb-6">sign-in</h1>
        <div class="w-full">
            <label for="email" class="text-red-600 font-medium block mb-2">email</label>
            <input type="email" formControlName="email" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="w-full">
            <label for="password" class="text-gray-700 font-medium block mb-2">password</label>
            <input type="password" formControlName="password" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        @if(errorMessage()){
            <p class="text-red-600 text-sm">{{errorMessage()}}</p>
        }
        <button type="submit" [disabled]="form.invalid || isLoading()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-md transition disabled:opacity-50 disabled:cursor-not-allowed">
            {{isLoading() ? 'loggin in'  : 'login'}}
        </button>
        <p class="text-sm text-gray-600">
            you dont'nt have an account? <a routerLink="/signup" class="text-indigo-600 hover:text-indigo-700 font-semibold">sign-up</a>
        </p>
    </form>
</div>
