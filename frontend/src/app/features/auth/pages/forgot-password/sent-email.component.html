<div class="min-h-screen flex flex-col justify-between relative px-4 py-8 sm:py-12 bg-[#09090b] text-white selection:bg-white/20">
  


  <!-- Tarjeta Cristalizada para Enviar Correo de Recuperación -->
  <div class="w-full max-w-md mx-auto my-auto pt-6 pb-6">
    <div class="glass-panel relative rounded-32px p-6 sm:p-8 shadow-2xl overflow-hidden">
      
      <!-- Ambient light -->
      <div class="absolute -top-12 left-1/2 -translate-x-1/2 w-48 h-20 bg-white/5 blur-2xl rounded-full pointer-events-none"></div>

      <!-- Icono y Título -->
      <div class="text-center space-y-2 relative z-10">
        <div class="mx-auto h-12 w-12 rounded-2xl glass-inner flex items-center justify-center text-white/80 shadow-inner mb-3">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
          </svg>
        </div>

        <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
          Recuperar Clave
        </h1>
        
        <p class="text-xs text-white/50 max-w-xs mx-auto">
          Ingresa el correo electrónico de tu cuenta y te enviaremos un código de verificación para restablecerla.
        </p>
      </div>

      <!-- Error Message -->
      @if (errMessage()) {
        <div class="mt-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-300 text-xs flex items-center gap-2">
          <svg class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
          <span>{{ errMessage() }}</span>
        </div>
      }

      <!-- Formulario Reactivo -->
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mt-6 space-y-4 relative z-10">
        <div>
          <label class="block text-xs font-medium text-white/80 mb-1.5">Correo Electrónico</label>
          <div class="relative">
            <input
              type="email"
              formControlName="email"
              placeholder="nombre@empresa.com"
              class="w-full rounded-xl bg-white/0.04 border border-white/15 pl-10 pr-3.5 py-2.5 text-sm text-white placeholder-white/30 focus:outline-none focus:border-white/40 focus:ring-1 focus:ring-white/20 backdrop-blur-sm transition-all"
            />
            <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 h-4 w-4 text-white/40" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
          </div>
        </div>

        <button
          type="submit"
          [disabled]="form.invalid || isLoading()"
          class="glass-btn w-full flex items-center justify-center gap-2 py-3 px-4 rounded-xl text-xs font-bold text-white tracking-wide shadow-xl disabled:opacity-50 mt-2 cursor-pointer"
        >
          @if (isLoading()) {
            <span class="h-4 w-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
            <span>Enviando código...</span>
          } @else {
            <span>Enviar Código de Seguridad</span>
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
            </svg>
          }
        </button>
      </form>

      <div class="mt-6 pt-4 border-t border-white/10 text-center relative z-10">
        <a routerLink="/login" class="text-xs text-white/50 hover:text-white transition-colors">
          ¿Recordaste tu contraseña? <span class="text-white underline">Inicia sesión</span>
        </a>
      </div>

    </div>
  </div>

  <footer class="text-center text-xs text-white/30">
    <p>© 2026 Black Russian Suite. Todos los derechos reservados.</p>
  </footer>

</div>
