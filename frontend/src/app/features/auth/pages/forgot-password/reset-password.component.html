<div class="flex min-h-screen items-center justify-center bg-slate-950 px-4 py-10 sm:px-6 lg:px-8">
  <div class="w-full max-w-xl rounded-[30px] border border-cyan-500/15 bg-slate-900/85 p-6 shadow-[0_24px_60px_rgba(8,15,30,0.5)] sm:p-8">
    <div class="mb-6 text-center">
      <p class="text-[10px] font-semibold uppercase tracking-[0.28em] text-cyan-300/80">Account</p>
      <h1 class="mt-2 text-3xl font-bold tracking-tight text-cyan-50">Reset password</h1>
      <p class="mt-2 text-sm text-slate-300">Confirm the code and choose a new secure password.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">
      <app-verify-code
        class="block w-full"
        (codeChange)="onCodeChange($event)"
        (resendCode)="onResendCode()"
      />

      <div class="space-y-2">
        <label for="newPassword" class="block text-sm font-medium text-slate-200">New password</label>
        <input
          id="newPassword"
          type="password"
          formControlName="newPassword"
          class="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2.5 text-cyan-50 shadow-sm outline-none transition focus:border-cyan-400 focus:bg-slate-950 focus:ring-4 focus:ring-cyan-500/15"
        />
      </div>

      @if (errorMessage()) {
        <p class="rounded-xl border border-red-500/20 bg-red-500/10 px-3 py-2 text-sm text-red-200">{{ errorMessage() }}</p>
      }

      <button
        type="submit"
        class="w-full rounded-xl bg-cyan-500 px-4 py-2.5 text-sm font-semibold text-slate-950 shadow-lg shadow-cyan-500/20 transition hover:bg-cyan-400 focus:outline-none focus:ring-4 focus:ring-cyan-500/20 disabled:cursor-not-allowed disabled:opacity-60"
      >
        {{ isLoading() ? 'Resetting...' : 'Reset password' }}
      </button>
    </form>
  </div>
</div>
