<div class="min-h-screen flex flex-col justify-between relative px-4 py-8 sm:py-12 bg-[#09090b] text-white selection:bg-white/20">
  
  <!-- Header con enlace a Login -->
  <header class="max-w-5xl w-full mx-auto flex items-center justify-between gap-4">
    <div class="flex items-center gap-2.5">
      <div class="h-9 w-9 rounded-xl glass-inner flex items-center justify-center text-white/90 shadow-inner">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
      </div>
      <div>
        <span class="text-sm font-bold tracking-wide">Black Russian</span>
        <span class="text-xs text-white/40 ml-1.5 font-mono">Reset Password</span>
      </div>
    </div>

    <a 
      routerLink="/login"
      class="glass-btn flex items-center gap-2 px-3.5 py-1.5 rounded-xl text-xs font-semibold text-white/80 hover:text-white transition-all"
    >
      <span>Cancelar</span>
    </a>
  </header>

  <!-- Tarjeta Cristalizada de Restablecimiento -->
  <div class="w-full max-w-md mx-auto my-auto pt-6 pb-6">
    <div class="glass-panel relative rounded-32px p-6 sm:p-8 shadow-2xl overflow-hidden">
      
      <!-- Ambient light -->
      <div class="absolute -top-12 left-1/2 -translate-x-1/2 w-48 h-20 bg-white/5 blur-2xl rounded-full pointer-events-none"></div>

      <!-- Título de la tarjeta -->
      <div class="text-center space-y-2 relative z-10">
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full glass-inner text-[11px] text-white/70 font-medium">
          <span class="h-1.5 w-1.5 rounded-full bg-emerald-400"></span>
          <span>Paso Final</span>
        </div>
        
        <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
          Nueva Contraseña
        </h1>
        
        <p class="text-xs text-white/50 max-w-xs mx-auto">
          Hemos enviado un código a <span class="text-white/80 font-mono">{{ email() }}</span>
        </p>
      </div>

      <!-- Alerta de Error -->
      @if (errorMessage()) {
        <div class="mt-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-300 text-xs flex items-center gap-2">
          <svg class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <!-- Formulario Reactivo de Reset -->
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mt-6 space-y-5 relative z-10">
        
        <!-- Tu Componente Personalizado de Código de 6 Dígitos -->
        <div>
          <label class="block text-xs font-medium text-white/80 mb-2 text-center">
            Código de Verificación (6 dígitos)
          </label>
          <div class="flex justify-center">
            <app-verify-code (codeChange)="onCodeChange($event)"></app-verify-code>
          </div>
          <input type="hidden" formControlName="code" />
        </div>

        <!-- Reenviar Código -->
        <div class="text-center">
          <button
            type="button"
            (click)="onResendCode()"
            class="text-[11px] text-white/50 hover:text-white underline transition-colors"
          >
            ¿No recibiste el código? Reenviar de nuevo
          </button>
        </div>

        <!-- Campo Nueva Contraseña -->
        <div>
          <label class="block text-xs font-medium text-white/80 mb-1.5">Nueva Contraseña (Mín. 8 caracteres)</label>
          <div class="relative">
            <input
              type="password"
              formControlName="newPassword"
              placeholder="Crea una contraseña segura"
              class="w-full rounded-xl bg-white/0.04 border border-white/15 pl-10 pr-3.5 py-2.5 text-sm text-white placeholder-white/30 focus:outline-none focus:border-white/40 focus:ring-1 focus:ring-white/20 backdrop-blur-sm transition-all"
            />
            <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 h-4 w-4 text-white/40" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
          </div>
        </div>

        <!-- Botón de Envío -->
        <button
          type="submit"
          [disabled]="form.invalid || isLoading()"
          class="glass-btn w-full flex items-center justify-center gap-2 py-3 px-4 rounded-xl text-xs font-bold text-white tracking-wide shadow-xl disabled:opacity-50 mt-2 cursor-pointer"
        >
          @if (isLoading()) {
            <span class="h-4 w-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
            <span>Actualizando contraseña...</span>
          } @else {
            <span>Cambiar Contraseña</span>
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
          }
        </button>
      </form>

    </div>
  </div>

  <footer class="text-center text-xs text-white/30">
    <p>© 2026 Black Russian Suite. Todos los derechos reservados.</p>
  </footer>

</div>
