<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/70 px-4 backdrop-blur-sm">
  <div class="w-full max-w-md rounded-[28px] border border-cyan-500/20 bg-slate-900/95 p-6 shadow-[0_24px_80px_rgba(14,165,233,0.18)] ring-1 ring-white/5">
    <div class="mb-5 flex items-start justify-between gap-3">
      <div>
        <p class="text-[11px] font-medium uppercase tracking-[0.24em] text-cyan-300/80">Security</p>
        <h3 class="mt-2 text-2xl font-bold text-white">Log out</h3>
      </div>
      <div class="flex h-11 w-11 items-center justify-center rounded-2xl border border-cyan-400/20 bg-cyan-500/10 text-cyan-300">
        <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M16 17v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
          <path d="M10 12h11" />
          <path d="m18 9 3 3-3 3" />
        </svg>
      </div>
    </div>

    <p class="mb-4 text-sm leading-6 text-slate-300">
      @if (isGoogleUser) {
        Are you sure you want to sign out of this active session?
      } @else {
        For security, enter your password to sign out of this session.
      }
    </p>

    @if (!isGoogleUser) {
      <input
        type="password"
        [(ngModel)]="passwordInput"
        placeholder="Your current password"
        class="mb-5 w-full rounded-xl border border-slate-700 bg-slate-800/80 px-3 py-2.5 text-slate-100 placeholder:text-slate-400 shadow-sm outline-none transition focus:border-cyan-400 focus:bg-slate-900 focus:ring-4 focus:ring-cyan-500/15"
      />
    }

    <div class="flex justify-end gap-3 pt-1">
      <button
        type="button"
        (click)="closeModal()"
        class="rounded-xl border border-slate-700 bg-slate-800 px-4 py-2.5 text-sm font-medium text-slate-200 transition hover:border-slate-600 hover:bg-slate-700"
      >
        Cancel
      </button>
      <button
        type="button"
        (click)="confirm()"
        class="rounded-xl bg-gradient-to-r from-cyan-500 to-sky-600 px-4 py-2.5 text-sm font-semibold text-white shadow-lg shadow-cyan-500/20 transition hover:from-cyan-400 hover:to-sky-500 focus:outline-none focus:ring-4 focus:ring-cyan-500/20"
      >
        Confirm
      </button>
    </div>
  </div>
</div>
