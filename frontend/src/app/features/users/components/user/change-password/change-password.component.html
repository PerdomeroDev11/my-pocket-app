<div class="relative w-full max-w-md rounded-[28px] border border-white/10 border-t-white/20 bg-black-russian-950/70 p-6 shadow-[0_30px_70px_rgba(0,0,0,0.85),inset_0_1px_0_rgba(255,255,255,0.1)] backdrop-blur-3xl">
    
    <!-- Top ambient light effect -->
    <div class="absolute -top-16 left-1/2 -translate-x-1/2 h-20 w-64 rounded-full bg-blue-500/10 blur-2xl pointer-events-none"></div>

    <!-- Close button -->
    <button
        type="button"
        (click)="modalRef.close()"
        class="absolute right-5 top-5 flex h-8 w-8 items-center justify-center rounded-full border border-white/10 bg-black-russian-900/60 text-black-russian-300 transition-all duration-200 hover:border-white/30 hover:bg-black-russian-900 hover:text-white focus:outline-none"
        aria-label="Close"
    >
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
    </button>

    <!-- Title with security icon -->
    <div class="flex items-center gap-3 pr-8">
        <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl border border-blue-500/30 bg-blue-500/10 shadow-[0_0_15px_rgba(59,130,246,0.2)]">
            <svg class="h-5 w-5 text-blue-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
            </svg>
        </div>
        <div>
            <h2 class="text-xl font-bold tracking-tight text-black-russian-50">Change password</h2>
            <p class="text-xs text-black-russian-400">Update your account security credentials.</p>
        </div>
    </div>

    <!-- Form -->
    <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" class="mt-6 space-y-4">
        
        <!-- Current Password -->
        <div class="space-y-1.5">
            <label for="password" class="flex items-center gap-1 text-[11px] font-semibold uppercase tracking-[0.12em] text-black-russian-300">
                <span>Current Password</span>
                <span class="text-blue-400">*</span>
            </label>
            <input
                type="password"
                formControlName="password"
                placeholder="••••••••••••"
                class="w-full rounded-xl border border-white/10 bg-black-russian-900/60 px-3.5 py-2.5 text-sm text-black-russian-50 placeholder-black-russian-500 outline-none transition-all duration-300 focus:border-blue-400/60 focus:bg-black-russian-900 focus:ring-4 focus:ring-blue-500/15"
            >
        </div>

        <!-- New Password -->
        <div class="space-y-1.5">
            <label for="newPassword" class="flex items-center gap-1 text-[11px] font-semibold uppercase tracking-[0.12em] text-black-russian-300">
                <span>New Password</span>
                <span class="text-blue-400">*</span>
            </label>
            <input
                type="password"
                formControlName="newPassword"
                placeholder="••••••••••••"
                class="w-full rounded-xl border border-white/10 bg-black-russian-900/60 px-3.5 py-2.5 text-sm text-black-russian-50 placeholder-black-russian-500 outline-none transition-all duration-300 focus:border-blue-400/60 focus:bg-black-russian-900 focus:ring-4 focus:ring-blue-500/15"
            >
        </div>

        <!-- Confirm Password -->
        <div class="space-y-1.5">
            <label for="confirmPassword" class="flex items-center gap-1 text-[11px] font-semibold uppercase tracking-[0.12em] text-black-russian-300">
                <span>Confirm Password</span>
                <span class="text-blue-400">*</span>
            </label>
            <input
                type="password"
                formControlName="confirmPassword"
                placeholder="••••••••••••"
                class="w-full rounded-xl border border-white/10 bg-black-russian-900/60 px-3.5 py-2.5 text-sm text-black-russian-50 placeholder-black-russian-500 outline-none transition-all duration-300 focus:border-blue-400/60 focus:bg-black-russian-900 focus:ring-4 focus:ring-blue-500/15"
            >
            @if (passwordForm.hasError('mismatch') && passwordForm.get('confirmPassword')?.touched) {
                <p class="mt-1.5 flex items-center gap-1 text-xs font-medium text-red-400">
                    <svg class="h-3.5 w-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                    The passwords do not match.
                </p>
            }
        </div>

        <!-- Submit button -->
        <div class="flex justify-end pt-3">
            <button
                type="submit"
                [disabled]="isLoading()"
                class="group relative flex w-full items-center justify-center gap-2 rounded-xl bg-blue-600 px-4 py-3 text-sm font-semibold text-white shadow-[0_10px_25px_rgba(37,99,235,0.4)] transition-all duration-300 hover:-translate-y-0.5 hover:bg-blue-500 hover:shadow-[0_15px_30px_rgba(37,99,235,0.6)] active:translate-y-0 disabled:cursor-not-allowed disabled:opacity-60 disabled:hover:translate-y-0 disabled:hover:bg-blue-600"
            >
                @if (isLoading()) {
                    <div class="flex items-center gap-2">
                        <div class="h-4 w-4 animate-spin rounded-full border-2 border-white border-t-transparent"></div>
                        <span>Updating credentials...</span>
                    </div>
                } @else {
                    <span>Save changes</span>
                }
            </button>
        </div>
    </form>
</div>
