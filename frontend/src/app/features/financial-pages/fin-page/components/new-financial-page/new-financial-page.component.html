 <button 
            (click)="onSubmit()"
            [disabled]="isLoading()"
            class=" p-4 , text-amber-50 , border-b-slate-950 bg-blue-400"
        >{{ isLoading() ? 'Loading...' : 'New page' }}</button>
    <div class="relative w-full max-w-md rounded-[28px] border border-cyan-500/15 bg-slate-900/85 p-6 shadow-[0_20px_50px_rgba(8,15,30,0.5)] backdrop-blur-sm">
    <button
        type="button"
        (click)="modalRef.close()"
        class="absolute right-4 top-4 text-slate-400 transition-colors hover:text-slate-200 focus:outline-none"
        aria-label="Close"
    >
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
    </button>

    <h2 class="pr-8 text-xl font-semibold tracking-tight text-cyan-50">New Page</h2>

    <form [formGroup]="formName" (ngSubmit)="onSubmit()" class="mt-5 space-y-4">
        <div class="space-y-2">
            <label for="password" class="flex items-center gap-1 text-xs font-semibold uppercase tracking-[0.12em] text-slate-300">
                <span>Name</span>
                <span class="mt-0.5 text-cyan-300">*</span>
            </label>
            <input
                type="text"
                formControlName="name"
                class="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2.5 text-cyan-50 outline-none transition focus:border-cyan-400 focus:ring-4 focus:ring-cyan-500/15"
            >
        </div>
        <div class="flex justify-end pt-2">
            <button
                type="submit"
                [disabled]="isLoading()"
                class="w-full rounded-xl bg-cyan-500 px-4 py-2.5 text-sm font-semibold text-slate-950 shadow-lg shadow-cyan-500/20 transition hover:bg-cyan-400 disabled:cursor-not-allowed disabled:opacity-60"
            >
                {{ isLoading() ? 'Updating...' : 'Save changes' }}
            </button>
        </div>
    </form>
</div>
