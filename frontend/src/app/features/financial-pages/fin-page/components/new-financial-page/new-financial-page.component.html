<div class="w-[min(32rem,92vw)] rounded-2xl bg-white p-6 shadow-xl">
  <div class="mb-5 flex items-center justify-between gap-3">
    <h2 class="text-xl font-semibold text-slate-900">Create financial page</h2>
    <button type="button" class="text-sm text-slate-500 hover:text-slate-800" (click)="modalRef.close(false)">
      Close
    </button>
  </div>

  <form [formGroup]="formName" (ngSubmit)="onSubmit()" class="space-y-4">
    <div>
      <label for="page-name" class="mb-1 block text-sm font-medium text-slate-700">Name</label>
      <input
        id="page-name"
        type="text"
        formControlName="name"
        class="w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm text-slate-900 outline-none transition focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200"
        placeholder="e.g. House budget, personal finances"
      />
    </div>

    <div class="flex justify-end gap-3 pt-2">
      <button
        type="button"
        class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50"
        (click)="modalRef.close(false)"
      >
        Cancel
      </button>
      <button
        type="submit"
        [disabled]="isLoading() || formName.invalid"
        class="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-emerald-500 disabled:cursor-not-allowed disabled:bg-emerald-300"
      >
        {{ isLoading() ? 'Creating...' : 'Create page' }}
      </button>
    </div>
  </form>
</div>
