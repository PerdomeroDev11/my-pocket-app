<div class="grid grid-cols-1 gap-6 p-4 w-full md:grid-cols-2 md:gap-7 lg:p-6">
    @if (isLoading() && !categoriesDate()) {
        <div class="col-span-full flex items-center justify-center rounded-3xl border border-white/10 bg-white/2 p-12 text-sm text-white/70 backdrop-blur-xl shadow-[0_16px_40px_rgba(0,0,0,0.35)]">
            <p class="font-medium tracking-wide">Loading information...</p>
        </div>
    }

    @for (category of categoriesDate() ?? []; track category.id) {
        <div class="group relative w-full overflow-hidden rounded-3xl border border-white/15 bg-black-russian-950/80  shadow-[0_16px_40px_rgba(0,0,0,0.45),inset_0_1px_1px_0_rgba(255,255,255,0.2)] backdrop-blur-xl transition-all duration-300 hover:border-white/25 hover:shadow-[0_20px_50px_rgba(0,0,0,0.6)]">
            <div class="relative flex items-center justify-between border-b border-white/10 bg-white/2 px-4 py-3.5 backdrop-blur-[2px] ">
              <div class="flex min-w-0 items-center gap-3">
                <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl border border-white/10 bg-white/4 text-white/80 shadow-inner">
                  <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
                  </svg>
                </div>
                <h3 class="truncate text-sm font-semibold uppercase tracking-wider text-white drop-shadow-sm sm:text-base">
                  {{ category.name }}
                </h3>
              </div>

              <div class="flex shrink-0 items-center justify-end gap-2">
                <app-button-update-category
                  [category]="category"
                ></app-button-update-category>

                <app-button-delete-category
                  [categoryId]="category.id"
                ></app-button-delete-category>

                <app-button-new-movement
                  [pageId]="pageId()"
                  [categoryId]="category.id"
                ></app-button-new-movement>
              </div>
            </div>

            <div class="relative flex-1 p-5 sm:p-6">
              <app-movement
                [pageId]="pageId()"
                [categoryId]="category.id"
                [categoryDate]="categoriesDate() ?? []"
              ></app-movement>
            </div>
        </div>
    }
</div>
