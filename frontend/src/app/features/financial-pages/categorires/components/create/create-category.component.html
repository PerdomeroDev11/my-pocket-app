<div class="w-[min(32rem,92vw)] rounded-2xl bg-white p-6 shadow-xl">
    <div class="mb-5 flex items-center justify-between gap-3">
        <h2 class="text-xl font-semibold text-slate-900">Create category</h2>
        <button type="button" class="text-sm text-slate-500 hover:text-slate-800" (click)="onCancel()">
            Close
        </button>
    </div>

    <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
            <label for="name" class="mb-1 block text-sm font-medium text-slate-700">Category name</label>
            <input
                type="text"
                id="name"
                formControlName="name"
                class="w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm text-slate-900 outline-none transition focus:border-cyan-500 focus:ring-2 focus:ring-cyan-200"
                placeholder="e.g. Food"
            >
        </div>

        <label for="isRecurrent" class="flex items-center gap-2 text-sm font-medium text-slate-700">
            <input
                type="checkbox"
                id="isRecurrent"
                formControlName="isRecurrent"
                class="h-4 w-4 rounded border-slate-300 text-cyan-600 focus:ring-cyan-500"
            >
            Is recurrent
        </label>

        @if (errMesagge()) {
            <p class="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">
                {{ errMesagge() }}
            </p>
        }

        <div class="flex justify-end gap-3 pt-2">
            <button
                type="button"
                class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50"
                (click)="onCancel()"
            >
                Cancel
            </button>
            <button
                type="submit"
                [disabled]="categoryForm.invalid || isLoading()"
                class="rounded-lg bg-cyan-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-cyan-500 disabled:cursor-not-allowed disabled:bg-cyan-300"
            >
                {{ isLoading() ? 'Creating...' : 'Create category' }}
            </button>
        </div>
    </form>
</div>
