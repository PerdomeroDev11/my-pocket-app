<div class="w-[min(32rem,92vw)] rounded-2xl bg-white p-6 shadow-xl">
      <div class="mb-5 flex items-center justify-between gap-3">
        <h2 class="text-xl font-semibold text-slate-900">Update movement</h2>
        <button type="button" class="text-sm text-slate-500 hover:text-slate-800" (click)="onCancel()">
          Close
        </button>
      </div>

      <form [formGroup]="formUpdate" (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">Name</label>
          <input
            type="text"
            formControlName="name"
            class="w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm text-slate-900 outline-none transition focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200"
            placeholder="e.g. Salary, transportation, rent payment"
          />
        </div>

        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">Description</label>
          <textarea
            formControlName="description"
            rows="3"
            class="w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm text-slate-900 outline-none transition focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200"
            placeholder="e.g. Utilities payment, salary income"
          ></textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="mb-1 block text-sm font-medium text-slate-700">Amount</label>
            <input
              type="number"
              min="0.01"
              step="0.01"
              formControlName="amount"
              class="w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm text-slate-900 outline-none transition focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200"
            />
          </div>

          <div>
            <label class="mb-1 block text-sm font-medium text-slate-700">Date</label>
            <input
              type="date"
              formControlName="date"
              class="w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm text-slate-900 outline-none transition focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200"
            />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="mb-1 block text-sm font-medium text-slate-700">Type</label>
            <select formControlName="typeMovement" class="w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm text-slate-900 outline-none transition focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200">
              @for (type of typeOptions; track type.value) {
                <option [value]="type.value">{{ type.label }}</option>
              }
            </select>
          </div>

          <app-options-financial-institution formControlName="institutionFinancialId" />
        </div>

        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">Receipt file</label>
          <label class="group flex cursor-pointer flex-col items-center justify-center gap-3 rounded-2xl border border-dashed border-slate-300 bg-slate-50 px-4 py-4 text-center transition hover:border-emerald-400 hover:bg-emerald-50/40">
            @if (currentReceiptUrl()) {
              <img [src]="currentReceiptUrl()" alt="Current receipt" class="h-28 w-full rounded-xl object-cover shadow-sm ring-1 ring-slate-200" />
            } @else {
              <div class="flex h-20 w-full items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-400">
                <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 16V4m0 0L7 9m5-5 5 5M4 15.5v2.25A2.25 2.25 0 0 0 6.25 20h11.5A2.25 2.25 0 0 0 20 17.75V15.5"/>
                </svg>
              </div>
            }
            <div class="flex flex-col items-center gap-1">
              <span class="text-sm font-medium text-slate-700">{{ currentReceiptUrl() ? 'Change receipt' : 'Upload a receipt' }}</span>
              <span class="text-[11px] uppercase tracking-[0.18em] text-slate-500">PNG, JPG, WEBP</span>
            </div>
            <input type="file" accept="image/*" class="hidden" (change)="onFileSelected($event)" />
          </label>
        </div>

        <label class="flex items-center gap-2 text-sm font-medium text-slate-700">
          <input type="checkbox" formControlName="isPay" class="h-4 w-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500" />
          Has it been paid yet?
        </label>

        @if (messageError()) {
          <p class="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">
            {{ messageError() }}
          </p>
        }

        <div class="flex justify-end gap-3 pt-2">
          <button type="button" class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50" (click)="onCancel()">
            Cancel
          </button>
          <button
            type="submit"
            [disabled]="formUpdate.invalid || isLoading()"
            class="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-emerald-500 disabled:cursor-not-allowed disabled:bg-emerald-300"
          >
            {{ isLoading() ? 'Saving...' : 'Update movement' }}
          </button>
        </div>
      </form>
    </div>
